name: CPU geometry data split and resumable controller tests
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-controller.txt -r requirements-config-tests.txt
      - run: python -m pip install --no-deps mmengine==0.10.7
      - run: python -m unittest discover -s tests -v
      - run: python run_all.py --plan-only
